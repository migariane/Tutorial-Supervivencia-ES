name: Publish Quarto to GitHub Pages

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install R packages
        run: |
          install.packages(c("survival", "survminer", "flexsurv", "KMsurv", 
                           "cmprsk", "rms", "ggplot2", "knitr", "rmarkdown",
                           "dplyr", "mice", "glmnet", "forestplot"))
        shell: Rscript {0}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Locate tutorial index.qmd
        run: |
          INDEX_PATH="$(find . -maxdepth 8 -name index.qmd | grep 'SURVIVAL/Tutorial-Supervivencia-ES' | head -n 1)"
          echo "INDEX_PATH=$INDEX_PATH"
          if [ -z "$INDEX_PATH" ]; then
            echo "Could not find tutorial index.qmd under SURVIVAL/Tutorial-Supervivencia-ES"
            exit 1
          fi
          TUTORIAL_DIR="$(dirname "$INDEX_PATH")"
          echo "TUTORIAL_DIR=$TUTORIAL_DIR"
          echo "TUTORIAL_DIR=$TUTORIAL_DIR" >> $GITHUB_ENV

      - name: Render tutorial
        run: |
          cd "$TUTORIAL_DIR"
          quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.TUTORIAL_DIR }}/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
